<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 5 Công Việc Phù Hợp - JobLink</title>
    <link rel="stylesheet" th:href="@{/header.css}">
    <style>
        .matching-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .matching-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .matching-header h1 {
            font-size: 32px;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .matching-header p {
            font-size: 16px;
            color: #7f8c8d;
        }
        .job-match-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 25px;
            margin-bottom: 20px;
            transition: transform 0.3s;
        }
        .job-match-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }
        .job-title {
            font-size: 22px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .company-name {
            font-size: 16px;
            color: #3498db;
            margin-bottom: 10px;
        }
        .match-percentage {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .job-details {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .detail-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #7f8c8d;
            font-size: 14px;
        }
        .matching-skills {
            background: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .matching-skills-title {
            font-size: 14px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        .skills-count {
            color: #3498db;
            font-weight: bold;
        }
        .job-description {
            color: #34495e;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .job-actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-view {
            background: #3498db;
            color: white;
        }
        .btn-view:hover {
            background: #2980b9;
        }
        .btn-apply {
            background: #2ecc71;
            color: white;
        }
        .btn-apply:hover {
            background: #27ae60;
        }
        .no-matches {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
<div th:replace="~{header :: header}"></div>

<div class="matching-container">
    <div class="matching-header">
        <h1>Top 5 Công Việc Phù Hợp Nhất</h1>
        <p>Dựa trên kỹ năng và kinh nghiệm của bạn</p>
    </div>

    <div th:if="${topMatches != null and !topMatches.isEmpty()}">
        <div th:each="job, iterStat : ${topMatches}" class="job-match-card">
            <div class="match-header">
                <div>
                    <div class="job-title" th:text="${job.title}">Job Title</div>
                    <div class="company-name" th:text="${job.companyName}">Company Name</div>
                </div>
                <div class="match-percentage" th:text="${#numbers.formatDecimal(job.matchPercentage, 0, 0)} + '%'">85%</div>
            </div>

            <div class="job-details">
                <div class="detail-item">
                    <span>📍</span>
                    <span th:text="${job.location}">Location</span>
                </div>
                <div class="detail-item" th:if="${job.salaryMin != null}">
                    <span>💰</span>
                    <span th:text="${#numbers.formatDecimal(job.salaryMin, 0, 'COMMA', 0, 'POINT')} + ' - ' + ${#numbers.formatDecimal(job.salaryMax, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">Salary</span>
                </div>
                <div class="detail-item">
                    <span>🏢</span>
                    <span th:text="${job.industry}">Industry</span>
                </div>
            </div>

            <div class="matching-skills">
                <div class="matching-skills-title">
                    Kỹ năng phù hợp:
                    <span class="skills-count" th:text="${job.matchingSkills} + '/' + ${job.totalJobSkills}">3/5</span>
                </div>
            </div>

            <div class="job-description" th:text="${#strings.abbreviate(job.description, 200)}">
                Job description...
            </div>

            <div class="job-actions">
                <button class="btn btn-view" th:onclick="'window.location.href=\'/job-detail/' + ${job.jobId} + '\''">
                    Xem chi tiết
                </button>
                <button class="btn btn-apply" th:onclick="'applyJob(' + ${job.jobId} + ')'">
                    Ứng tuyển ngay
                </button>
            </div>
        </div>
    </div>

    <div th:if="${topMatches == null or topMatches.isEmpty()}" class="no-matches">
        <h2>Không tìm thấy công việc phù hợp</h2>
        <p>Hãy cập nhật thêm kỹ năng vào hồ sơ của bạn để nhận được gợi ý tốt hơn</p>
    </div>
</div>

<script>
    function applyJob(jobId) {
        // Redirect to job detail page or open apply modal
        window.location.href = '/job-detail/' + jobId;
    }
</script>
</body>
</html>
