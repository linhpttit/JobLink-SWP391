<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý tin tuyển dụng</title>
    <link rel="stylesheet" href="/CSS/recruitment.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="recruitment-management">

    <!-- Header -->
    <div class="recruitment-header">
        <h2 class="recruitment-title"><i class="fa-solid fa-file"></i> Tin tuyển dụng</h2>
    </div>

    <div class="recruitment-stats">
        <div class="stat-card">
            <div class="stat-icon">
                <i class="fas fa-clipboard-list"></i>
            </div>
            <div class="stat-info">
                <h3 th:text="${totalJobs}">0</h3>
                <p>Tổng số tin</p>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon active">
                <i class="fas fa-check-circle"></i>
            </div>
            <div class="stat-info">
                <h3 th:text="${activeJobs}">0</h3>
                <p>Đang hoạt động</p>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon inactive">
                <i class="fas fa-times-circle"></i>
            </div>
            <div class="stat-info">
                <h3 th:text="${inactiveJobs}">0</h3>
                <p>Bị ẩn</p>
            </div>
        </div>
    </div>


    <!-- Recruitment Table -->
    <div class="recruitment-table-container">
        <table class="recruitment-table">
            <thead>
            <tr>
                <th>Tiêu đề</th>
                <th>Công ty</th>
                <th>Kỹ năng</th>
                <th>Địa điểm</th>
                <th>Lương</th>
                <th>Ngày đăng</th>
                <th>Trạng thái</th>
                <th>Thao tác</th>
            </tr>
            </thead>

            <tbody>
            <tr th:if="${jobs == null or #lists.isEmpty(jobs)}">
                <td colspan="8" style="text-align:center; padding:20px; color:#888;">
                    Không có dữ liệu
                </td>
            </tr>

            <tr th:each="job : ${jobs}">
                <td th:text="${job.title}"></td>
                <td th:text="${job.employer.companyName}"></td>
                <td th:text="${job.skill.name}"></td>
                <td th:text="${job.province.provinceName}"></td>
                <td>
                    <span th:text="${job.salaryMin}"></span> -
                    <span th:text="${job.salaryMax}"></span>
                </td>
                <td th:text="${#temporals.format(job.postedAt, 'dd/MM/yyyy')}"></td>

                <!-- Status -->
                <td class="job-status"
                    th:classappend="${#strings.toLowerCase(job.status) == 'active'} ? 'job-status-active' : 'job-status-inactive'"
                    th:text="${#strings.toLowerCase(job.status) == 'active' ? 'Đang hoạt động' : 'Bị ẩn'}">
                </td>

                <!-- Button -->
                <td>
                    <button class="btn-toggle"
                            th:data-job-id="${job.jobId}"
                            th:classappend="${#strings.toLowerCase(job.status) == 'active'} ? 'active' : 'inactive'"
                            th:text="${#strings.toLowerCase(job.status) == 'active' ? 'Ẩn bài' : 'Mở bài'}">
                    </button>
                </td>
            </tr>
            </tbody>

        </table>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
    $(document).ready(function(){

        $(".btn-toggle").click(function(){
            if(!confirm("Bạn có chắc muốn thay đổi trạng thái bài tuyển dụng này không?")) return;

            let btn = $(this);
            let jobId = btn.data("job-id");

            $.post("/admin/job/toggle/" + jobId, function(response){

                let isActive = response.status.toLowerCase() === "active";

                // Update button
                btn.text(isActive ? "Ẩn bài" : "Active");
                btn.toggleClass("active", isActive);
                btn.toggleClass("inactive", !isActive);

                // Update status text
                btn.closest("tr").find(".job-status")
                    .text(isActive ? "Đang hoạt động" : "Bị ẩn")
                    .toggleClass("job-status-active", isActive)
                    .toggleClass("job-status-inactive", !isActive);

                // Update statistics
                $(".stat-card").eq(0).find("h3").text(response.totalJobs);
                $(".stat-card").eq(1).find("h3").text(response.activeJobs);
                $(".stat-card").eq(2).find("h3").text(response.inactiveJobs);
            });
        });

    });
</script>

</body>
</html>
